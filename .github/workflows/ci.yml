name: ci

# Runs on every push and every pull request. A suite that only runs after
# merge finds its failures in main, which is the same as finding them in
# production.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    # The silent_tests suite needs a real database, not a mock: RLS, NULL
    # constraints and cascade behaviour are exactly what is being tested, and
    # none of them exist in a fake.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nedlang_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nedlang_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # requirements.txt is generated from uv.lock for Render. Add a dependency
      # with uv and forget to re-export, and local keeps working while the
      # deploy silently ships without it. Catch that here, not in production.
      - name: requirements.txt matches uv.lock
        working-directory: backend
        run: |
          pip install uv
          uv export --frozen --no-hashes --no-emit-project --format requirements-txt \
            | diff -u requirements.txt -

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Silent-failure suite
        run: pytest silent_tests.py -v

  # Kept separate so a frontend failure is legible as a frontend failure.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx tsc --noEmit
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
