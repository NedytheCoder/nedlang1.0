[pytest]
# Markers are registered here rather than in the test module because pytest
# only honours pytest_configure from conftest.py and installed plugins — a
# hook in a test file is collected, never called. Registering them in the
# module *looked* correct and silently did nothing, which is on-theme.
#
# Run one category before touching the code it guards:
#   pytest -m money      before anything that can spend
#   pytest -m gdpr       before anything that touches user rows
markers =
    money: the API budget cannot be drained
    loop: the core learning loop closes
    review: mistakes come back on schedule
    schema: no column is a lie
    reachable: no endpoint is an orphan
    isolation: one learner cannot see another
    gdpr: erasure and export are complete
    privacy: no personal data reaches the AI provider
    degrade: the product survives its dependencies failing
    meta: this suite cannot report success it has not earned

# Unknown markers become errors. Otherwise a typo'd `-m monye` selects zero
# tests and reports success.
addopts = --strict-markers -ra
